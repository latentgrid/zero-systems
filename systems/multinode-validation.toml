# Four learner / two local actor GPU split used for long-run validation.
# Six actors per GPU use this node's available CPU capacity; MPS starts externally.
learner_devices = ["cuda:0", "cuda:1", "cuda:2", "cuda:4"]
actor_devices = ["cuda:3", "cuda:5"]
actors_per_device = 6
actor_batch = 128
microbatch = 256
precision = "bfloat16"
actor_precision = "bfloat16"
compile = true
deterministic = true
queue_batches = 32
timeout = 900.0
checkpoint_updates = 10000
model_updates = 1200
log_updates = 100
listen = "127.0.0.1:47631"
